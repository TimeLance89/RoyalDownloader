<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
  <title id="title">Royal Cinema</title>
  <desc id="desc">Royal Cinema wordmark with a red crown and cinema aperture emblem.</desc>
  <defs>
    <linearGradient id="royalRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2432"/>
      <stop offset="0.52" stop-color="#e50914"/>
      <stop offset="1" stop-color="#8e050d"/>
    </linearGradient>
    <linearGradient id="deepRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff1828"/>
      <stop offset="1" stop-color="#7b0208"/>
    </linearGradient>
    <radialGradient id="iconBg" cx="48%" cy="38%" r="74%">
      <stop offset="0" stop-color="#251014"/>
      <stop offset="0.62" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <filter id="redGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(10 12)">
    <rect x="0" y="0" width="218" height="218" rx="42" fill="url(#iconBg)" stroke="#2b2b2f" stroke-width="3"/>
    <path d="M38 82 L61 103 L83 61 L109 91 L137 54 L158 104 L185 82 L173 145 L50 145 Z"
          fill="url(#deepRed)" stroke="#ff2733" stroke-width="4" stroke-linejoin="round" filter="url(#redGlow)"/>
    <path d="M109 32 L114 47 L130 49 L117 59 L121 75 L109 66 L96 75 L101 59 L88 49 L104 47 Z"
          fill="#ff4a24" filter="url(#softGlow)"/>
    <g transform="translate(109 137)">
      <circle r="61" fill="#09090b" stroke="#e50914" stroke-width="5"/>
      <circle r="48" fill="#120609" stroke="#661017" stroke-width="2"/>
      <path d="M-4 -48 C22 -47 42 -31 50 -10 C25 -18 4 -15 -14 -4 Z" fill="#f01723"/>
      <path d="M48 -8 C53 17 42 39 23 51 C21 25 11 8 -5 -4 Z" fill="#c70b15"/>
      <path d="M21 51 C-2 61 -27 55 -43 40 C-19 31 -6 18 -4 -4 Z" fill="#a0060e"/>
      <path d="M-44 38 C-59 18 -57 -8 -45 -27 C-28 -8 -14 -1 -4 -4 Z" fill="#e50914"/>
      <path d="M-44 -29 C-25 -50 1 -56 23 -47 C7 -28 0 -14 -4 -4 Z" fill="#b50710"/>
      <circle r="13" fill="#070708"/>
    </g>
  </g>

  <g transform="translate(270 42)">
    <text x="0" y="94" fill="url(#royalRed)" stroke="#65050a" stroke-width="1"
          font-family="Archivo, Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="2">ROYAL</text>
    <text x="8" y="164" fill="#ffffff"
          font-family="Archivo, Arial, Helvetica, sans-serif" font-size="52" font-weight="600" letter-spacing="18">CINEMA</text>
  </g>
</svg>
