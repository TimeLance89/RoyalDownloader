name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - app_version.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        run: |
          version="$(python -c 'from app_version import APP_VERSION; print(APP_VERSION)')"
          tag_name="v${version}"
          git fetch --no-tags origin main

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${tag_name}" = "${GITHUB_REF_NAME}"
            test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          else
            test "${GITHUB_REF}" = "refs/heads/main"
            test -z "$(git tag --list "${tag_name}")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${tag_name}" "${GITHUB_SHA}" \
              --message "RoyalDownloader ${tag_name}"
            git push origin "refs/tags/${tag_name}"
          fi

          echo "RELEASE_TAG=${tag_name}" >> "${GITHUB_ENV}"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --prerelease \
            --title "RoyalDownloader ${RELEASE_TAG}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            --generate-notes
