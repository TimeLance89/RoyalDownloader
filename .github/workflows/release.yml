name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - app_version.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # immutable v7 line
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        run: |
          version="$(python -c 'from app_version import APP_VERSION; print(APP_VERSION)')"
          tag_name="v${version}"
          git fetch --no-tags origin main

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${tag_name}" = "${GITHUB_REF_NAME}"
            test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          else
            test "${GITHUB_REF}" = "refs/heads/main"
            if git rev-parse --verify --quiet "refs/tags/${tag_name}"; then
              test "$(git rev-list -n 1 "${tag_name}")" = "${GITHUB_SHA}"
              test "$(git cat-file -t "${tag_name}")" = "tag"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag --annotate "${tag_name}" "${GITHUB_SHA}" \
                --message "RoyalDownloader ${tag_name}"
              git push origin "refs/tags/${tag_name}"
            fi
          fi

          echo "RELEASE_TAG=${tag_name}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to publish."
            exit 0
          fi
          release_flags=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "RoyalDownloader ${RELEASE_TAG}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            --generate-notes \
            "${release_flags[@]}"
