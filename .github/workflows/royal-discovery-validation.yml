name: Royal Discovery branch validation
on:
  push:
    branches:
      - feature/royal-discovery-3-home-20261019
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproducible Git archive
        shell: bash
        run: |
          git archive --format=tar HEAD | gzip -n > royal-discovery-source.tar.gz
          test -s royal-discovery-source.tar.gz
          echo "ARCHIVE_BYTES=$(stat -c%s royal-discovery-source.tar.gz)" >> "$GITHUB_ENV"
      - name: Upload worktree archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royal-discovery-source
          path: royal-discovery-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install locked development requirements
        run: python -m pip install -r requirements-dev.lock
      - name: Python Discovery and layout integration tests
        run: python -m pytest -q tests/test_home_discovery.py tests/test_home_discovery_frontend.py tests/test_home_layout.py tests/test_taste_profile_v2.py tests/test_taste_frontend_v2.py tests/test_home_experience_v2.py
      - name: Node Discovery and component regression tests
        run: |
          node --test tests/frontend/royal-discovery-3.test.mjs tests/frontend/home-taste-readiness.test.mjs tests/frontend/home-navigation.test.mjs
      - name: Syntax smoke
        run: |
          python -m compileall -q features api core
          find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
