name: Build Jellyfin RD Fire TV

on:
  pull_request:
    branches:
      - experiment/jellyfin-firetv-rd
    paths:
      - "tools/jellyfin-firetv-rd/**"
      - ".github/workflows/build-jellyfin-firetv-rd.yml"
  workflow_dispatch:
  push:
    branches:
      - experiment/jellyfin-firetv-rd
    paths:
      - "tools/jellyfin-firetv-rd/**"
      - ".github/workflows/build-jellyfin-firetv-rd.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JELLYFIN_VERSION: "0.19.10"
    steps:
      - name: Checkout integration scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout Jellyfin Android TV v0.19.10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jellyfin/jellyfin-androidtv
          ref: v0.19.10
          path: jellyfin

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: jellyfin/**/*.gradle*

      - name: Apply RoyalDownloader integration
        run: python3 tools/jellyfin-firetv-rd/patch_jellyfin.py jellyfin

      - name: Show patch summary
        working-directory: jellyfin
        run: git diff --stat && git diff --check

      - name: Build debug APK
        working-directory: jellyfin
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify watchlist and download policies
        working-directory: jellyfin
        run: ./gradlew :app:testDebugUnitTest --tests 'org.jellyfin.androidtv.ui.home.RoyalWatchlistPolicyTests' --tests 'org.jellyfin.androidtv.integration.royaldownloader.RoyalDownloadPolicyTests' --tests 'org.jellyfin.androidtv.ui.search.RoyalSearchViewModelTests'

      - name: Collect APK
        run: |
          mkdir -p out
          cp jellyfin/app/build/outputs/apk/debug/*.apk out/Jellyfin-RD-FireTV-v0.19.10-debug.apk
          sha256sum out/Jellyfin-RD-FireTV-v0.19.10-debug.apk | tee out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Jellyfin-RD-FireTV-v0.19.10
          path: out/*
          if-no-files-found: error
          retention-days: 30
