name: WebKit mobile validation
on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    # Browsers + OS libraries are baked into this version-matched image.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'overnight' || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install matching Playwright JavaScript package
        run: |
          # Retry transient npm ECONNRESET errors without hiding test failures.
          for attempt in 1 2 3; do
            if npm install --prefix "${RUNNER_TEMP}/royal-webkit" --no-save --ignore-scripts --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 playwright@1.62.1; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$attempt"
          done
          echo "ROYAL_PLAYWRIGHT=${RUNNER_TEMP}/royal-webkit/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Mobile WebKit real taps and layout contracts
        run: node tests/frontend/webkit-mobile.cjs
      - name: Failed boot recovery and unchanged bundled stylesheet rendering
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/startup-recovery-browser.cjs
      - name: Series subscription artwork, fallback and detail navigation
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/subscription-summary-browser.cjs
      - name: Authenticator setup, recovery and second-factor login
        env:
          ROYAL_BROWSER: webkit
        run: |
          node tests/frontend/totp-browser.cjs
          node tests/frontend/remote-access-browser.cjs

      - name: Source Sentinel settings and hoster repair confirmation
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/provider-monitor-browser.cjs

      - name: Personal Jellyfin wishes and profile isolation
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/saved-media-browser.cjs
      - name: Movie Jellyfin ribbons across navigation and background checks
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/movie-jellyfin-browser.cjs
      - name: Storage Autopilot mobile permissions and confirmations
        env:
          ROYAL_BROWSER: webkit
        run: |
          node tests/frontend/storage-autopilot-browser.cjs
          node tests/frontend/storage-mount-status-browser.cjs

      - name: Native mobile navigation and subscription inbox
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/mobile-app-browser.cjs

      - name: Mobile Download Center WebKit states, artwork and actions
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/download-center-browser.cjs

      - name: Upload WebKit Download Center renderings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-download-center-webkit
          path: artifacts/mobile-download-center/
