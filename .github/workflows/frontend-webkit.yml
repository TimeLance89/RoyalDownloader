name: WebKit mobile validation
on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'overnight' || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install isolated WebKit tooling
        run: |
          npm install --prefix "${RUNNER_TEMP}/royal-webkit" --no-save --ignore-scripts playwright@1.62.1
          "${RUNNER_TEMP}/royal-webkit/node_modules/.bin/playwright" install --with-deps webkit
          echo "ROYAL_PLAYWRIGHT=${RUNNER_TEMP}/royal-webkit/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Mobile WebKit real taps and layout contracts
        run: node tests/frontend/webkit-mobile.cjs
