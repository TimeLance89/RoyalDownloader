name: WebKit mobile validation
on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'overnight' || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install isolated WebKit tooling
        run: |
          npm install --prefix "${RUNNER_TEMP}/royal-webkit" --no-save --ignore-scripts playwright@1.62.1
          "${RUNNER_TEMP}/royal-webkit/node_modules/.bin/playwright" install --with-deps webkit
          echo "ROYAL_PLAYWRIGHT=${RUNNER_TEMP}/royal-webkit/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Mobile WebKit real taps and layout contracts
        run: node tests/frontend/webkit-mobile.cjs
      - name: Source Sentinel settings and hoster repair confirmation
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/provider-monitor-browser.cjs

      - name: Personal Jellyfin wishes and profile isolation
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/saved-media-browser.cjs
      - name: Storage Autopilot mobile permissions and confirmations
        env:
          ROYAL_BROWSER: webkit
        run: |
          node tests/frontend/storage-autopilot-browser.cjs
          node tests/frontend/storage-mount-status-browser.cjs

      - name: Native mobile navigation and subscription inbox
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/mobile-app-browser.cjs

      - name: Mobile Download Center WebKit states, artwork and actions
        env:
          ROYAL_BROWSER: webkit
        run: node tests/frontend/download-center-browser.cjs

      - name: Upload WebKit Download Center renderings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-download-center-webkit
          path: artifacts/mobile-download-center/
