name: Quality checks

on:
  push:
    branches:
      - main
      - overnight
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and frozen CSS baseline
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install isolated browser test tooling
        shell: bash
        run: |
          npm install --prefix "${RUNNER_TEMP}/royal-frontend-tests" --no-save --ignore-scripts playwright@1.62.1
          "${RUNNER_TEMP}/royal-frontend-tests/node_modules/.bin/playwright" install --with-deps chromium
          echo "ROYAL_PLAYWRIGHT=${RUNNER_TEMP}/royal-frontend-tests/node_modules/playwright" >> "$GITHUB_ENV"
          echo "ROYAL_BROWSER=chromium" >> "$GITHUB_ENV"

      - name: Browser interaction and lifecycle regression
        run: node tests/frontend/browser-smoke.cjs

      - name: Populated movie and series catalogs on desktop and touch mobile
        run: node tests/frontend/catalog-browser.cjs
      - name: Series pagination recovery
        run: node tests/frontend/series-pagination-browser.cjs

      - name: Source Sentinel provider and hoster settings and repair confirmation
        run: node tests/frontend/provider-monitor-browser.cjs

      - name: Guided language setup, subscription choices and readiness transition
        run: node tests/frontend/language-studio-browser.cjs

      - name: Storage Autopilot permissions, volume policy and touch layouts
        run: node tests/frontend/storage-autopilot-browser.cjs

      - name: Similar title navigation and independent detail failures
        run: node tests/frontend/similar-browser.cjs

      - name: First-run setup and authentication browser regression
        if: ${{ !cancelled() }}
        run: |
          node tests/frontend/setup-browser.cjs
          node tests/frontend/onboarding-studio-browser.cjs

      - name: Native mobile gestures, seams, orientation and navigation
        run: |
          node tests/frontend/series-selection-browser.cjs
          node tests/frontend/episode-probe-browser.cjs
          node tests/frontend/mobile-app-browser.cjs
          node tests/frontend/mobile-layout.cjs
          node tests/frontend/mobile-browser.cjs

      - name: Mobile settle fallback without scrollend
        env:
          ROYAL_SCROLLEND_FALLBACK: "1"
        run: node tests/frontend/mobile-browser.cjs

      - name: Frozen desktop and mobile CSS equivalence
        if: ${{ !cancelled() }}
        run: node tests/frontend/css-equivalence.cjs

  frontend-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install isolated measurement tooling
        run: |
          npm install --prefix "${RUNNER_TEMP}/royal-perf" --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0 pixelmatch@7.2.0
          "${RUNNER_TEMP}/royal-perf/node_modules/.bin/playwright" install --with-deps chromium
          echo "ROYAL_PLAYWRIGHT=${RUNNER_TEMP}/royal-perf/node_modules/playwright" >> "$GITHUB_ENV"
          git worktree add --detach "${RUNNER_TEMP}/royal-perf-baseline" d3aada9099703c0b9d9b6201f49082c52ddff0d7
      - name: Paired frozen baseline (same worker and browser)
        run: |
          ROYAL_WEB_ROOT="${RUNNER_TEMP}/royal-perf-baseline/web" ROYAL_PERF_OUTPUT=artifacts/frontend-performance/baseline node tests/frontend/performance-benchmark.cjs
      - name: Current performance and content budgets
        run: |
          ROYAL_PERF_OUTPUT=artifacts/frontend-performance/current node tests/frontend/performance-benchmark.cjs
          node tests/frontend/performance-budget.cjs artifacts/frontend-performance/baseline/metrics.json artifacts/frontend-performance/current/metrics.json
      - name: Populated rail visual comparison
        run: |
          ROYAL_VISUAL_BASELINE_WEB="${RUNNER_TEMP}/royal-perf-baseline/web" node tests/frontend/carousel-visual.cjs
      - name: Offscreen layout budget and stable page height
        run: node tests/frontend/offscreen-browser.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frontend-performance
          path: artifacts/frontend-performance/

  frontend-webkit:
    uses: ./.github/workflows/frontend-webkit.yml

  verify:
    needs: [frontend-browser, frontend-performance, frontend-webkit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Require successful frontend browser gate
        if: ${{ needs.frontend-browser.result != 'success' || needs.frontend-performance.result != 'success' || needs.frontend-webkit.result != 'success' }}
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # immutable v7 line
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: change-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/overnight" && "$HEAD_COMMIT_MESSAGE" == *"(#"* ]]; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${PR_BASE_SHA}...${GITHUB_SHA}" > changed-files.txt
          backend=false
          while IFS= read -r path; do
            case "$path" in
              web/*|tests/frontend/*|tests/frontend_smoke.test.mjs|tests/movie_catalog_refresh.test.mjs|.github/workflows/quality.yml)
                ;;
              *) backend=true; break ;;
            esac
          done < changed-files.txt
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba # immutable v6 line
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Compile Python sources
        run: |
          python -m py_compile *.py scripts/*.py
          python -m compileall -q application_services providers

      - name: Check web JavaScript
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Frontend contract smoke tests
        run: node --test tests/frontend_smoke.test.mjs tests/frontend/core.test.mjs tests/series_card_summary.test.mjs tests/frontend/subscription_center.test.cjs tests/frontend/carousel-geometry.test.mjs tests/frontend/detail-loader.test.mjs tests/frontend/series-pagination.test.mjs

      - name: Python correctness baseline
        run: ruff check --select E9,F63,F7,F82 .

      - name: Project security regression scan
        run: python scripts/security_scan.py

      - name: Security baseline
        # B310 is covered more strictly by security_scan.py: every urlopen call
        # is inventoried and its endpoint/scheme boundary is asserted there.
        run: bandit -q -ll -r . -x ./tests -s B310

      - name: Audit locked dependencies
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        run: |
          pip-audit -r requirements.lock
          pip-audit -r requirements-dev.lock

      - name: Generate Python dependency SBOM
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        run: pip-audit -r requirements.lock --format cyclonedx-json --output dependency-sbom.cdx.json

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Run tests with critical-module coverage
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        run: |
          coverage run --source=application_services,core.app_state,core.auth,core.config,media.media_quality,core.network_guard,core.proxy_security,core.queue_jobs,core.queue_performance,core.runtime_cache,core.security_runtime,updates.self_updater,core.setup_bootstrap,updates.update_channels,updates.update_checker,core.websocket_manager,updates.ytdlp_updater,integrations.serienstream_shared_session,media.session_manager -m pytest -q
          coverage report --skip-covered --fail-under=45
          coverage report \
            --include='application_services/movie_subscription_quality_hardening.py,application_services/movie_subscription_runtime_hardening.py,application_services/download_storage_guard.py' \
            --fail-under=65
          coverage report --include='integrations/serienstream_shared_session.py' --fail-under=70
          coverage report --include='application_services/auth.py' --fail-under=75
          coverage report --include='application_services/security_hardening.py' --fail-under=90
          coverage xml -o coverage.xml

      - name: Build container image
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        run: |
          docker build \
            --build-arg APP_COMMIT_SHA="${GITHUB_SHA}" \
            --tag royal-downloader:quality \
            .
          docker build \
            --build-arg BASE_IMAGE=royal-downloader:quality \
            --file Dockerfile.release-gate \
            --tag royal-downloader:release-gate \
            .

      - name: Scan container for high and critical CVEs
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # trivy 0.74 line
        with:
          image-ref: royal-downloader:quality
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 3m0s
          trivyignores: .trivyignore.yaml

      - name: Generate container SBOM
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: royal-downloader:quality
          format: cyclonedx
          output: container-sbom.cdx.json
          exit-code: "0"
          # The preceding scan already installed Trivy and populated its DB.
          # Re-entering actions/cache here can hang while restoring the same DB.
          skip-setup-trivy: "true"
          cache: "false"
          timeout: 3m0s

      - name: Smoke-test isolated SerienStream browser boundary
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        shell: bash
        run: |
          browser_network="royal-browser-quality-${GITHUB_RUN_ID}"
          cleanup_browser() {
            docker rm -f royal-browser-quality >/dev/null 2>&1 || true
            docker network rm "${browser_network}" >/dev/null 2>&1 || true
          }
          trap cleanup_browser EXIT
          docker network create "${browser_network}"
          docker run --detach --name royal-browser-quality \
            --network "${browser_network}" \
            --read-only \
            --pids-limit 256 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --shm-size 1g \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777 \
            --tmpfs /home/royal:rw,nosuid,nodev,size=128m,mode=0700,uid=1000,gid=1000 \
            --tmpfs /browser-profile:rw,nosuid,nodev,size=512m,mode=0700,uid=1000,gid=1000 \
            --entrypoint /bin/sh \
            royal-downloader:quality -c '
              Xvfb :99 -screen 0 1280x900x24 -nolisten tcp >/dev/null 2>&1 &
              python -m integrations.browser_cdp_proxy --listen-host 0.0.0.0 &
              export DISPLAY=:99
              exec chromium --no-sandbox --disable-dev-shm-usage \
                --disable-background-networking --disable-client-side-phishing-detection \
                --no-first-run --no-default-browser-check \
                --remote-debugging-port=9223 \
                --user-data-dir=/browser-profile --window-size=1280,900 about:blank
            '
          for attempt in $(seq 1 45); do
            if docker exec royal-browser-quality python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9222/json/version', timeout=2)"; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs royal-browser-quality
              exit 1
            fi
            sleep 1
          done
          docker run --rm \
            --network "${browser_network}" \
            --env ROYAL_BROWSER_CDP_URL=http://royal-browser-quality:9222 \
            --entrypoint python \
            royal-downloader:quality -c '
          import time
          import core.auth as auth
          import core.config as config
          from core.security_runtime import install_pre_state_security
          install_pre_state_security(config, auth)
          from integrations.serienstream_verification import SERIESSTREAM_VERIFICATION
          from integrations.serienstream_shared_session import _BrowserRuntime

          manager = SERIESSTREAM_VERIFICATION
          with manager._lock:
              cdp = manager._start_processes_locked()
              manager._cdp = cdp
              try:
                  cdp.navigate("data:text/html,<html><body><h1>Royal Verifier OK</h1></body></html>")
                  time.sleep(0.5)
                  image = cdp.screenshot()
                  assert image.startswith(b"\x89PNG\r\n\x1a\n"), "Verifier CDP did not return PNG"
              finally:
                  manager._cleanup_locked()

          runtime = _BrowserRuntime()
          try:
              cdp = runtime.start()
              cdp.navigate("data:text/html,<html><body><h1>Royal Shared Session OK</h1></body></html>")
              time.sleep(0.5)
              assert "Royal Shared Session OK" in cdp.html(), "Shared CDP did not render"
          finally:
              runtime.close()
          '

      - name: Smoke-test fail-closed read-only container startup
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        shell: bash
        run: |
          smoke_root="${RUNNER_TEMP}/royal-quality-smoke"
          mkdir -p "${smoke_root}/runtime" "${smoke_root}/data" \
            "${smoke_root}/movies" "${smoke_root}/series"
          sudo chown -R 1000:1000 "${smoke_root}"
          cleanup() { docker rm -f royal-quality-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name royal-quality-smoke \
            --publish 127.0.0.1:18765:8765 \
            --read-only \
            --pids-limit 512 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777 \
            --tmpfs /home/royal:rw,nosuid,nodev,size=256m,mode=0700,uid=1000,gid=1000 \
            --volume "${smoke_root}/runtime:/runtime" \
            --volume "${smoke_root}/data:/app/data" \
            --volume "${smoke_root}/movies:/movies" \
            --volume "${smoke_root}/series:/serien" \
            royal-downloader:quality
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18765/api/health > health.json; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs royal-quality-smoke
              exit 1
            fi
            sleep 2
          done
          python -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
          curl --fail --silent http://127.0.0.1:18765/api/v1/capabilities > capabilities.json
          python -c 'import json,os; from app_version import APP_VERSION; p=json.load(open("capabilities.json")); assert p["application_version"] == APP_VERSION; assert p["build"] == os.environ["GITHUB_SHA"][:12]'
          python -c 'import json; p=json.load(open("capabilities.json")); assert p["update_channels"] == {"stable": "main", "overnight": "overnight"}'
          curl --fail --silent http://127.0.0.1:18765/api/setup/status > setup-status.json
          python -c 'import json; p=json.load(open("setup-status.json")); assert p["required"] is True; assert p["bootstrap_required"] is True; assert "token" not in p'
          test "$(docker exec royal-quality-smoke stat -c %a /app/data/FilmeDownloader/setup_bootstrap.json)" = "600"
          status="$(curl --silent --output protected.json --write-out '%{http_code}' http://127.0.0.1:18765/api/v1/updater/config)"
          test "$status" = "401"
          python -c 'import json; p=json.load(open("protected.json")); assert p["code"] == "auth_required"'
          docker restart royal-quality-smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs royal-quality-smoke
          exit 1

      - name: E2E 1 - first run, bootstrap, login and protected API
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        run: |
          flow_volume="royal-release-flow-${GITHUB_RUN_ID}"
          docker volume create "${flow_volume}"
          docker run --rm --user 0 \
            -v "${flow_volume}:/app/data" \
            --entrypoint sh \
            royal-downloader:quality \
            -c 'chown -R 1000:1000 /app/data'
          docker run --rm \
            -e ROYAL_SETUP_TOKEN=release-readiness-bootstrap \
            -v "${flow_volume}:/app/data" \
            --entrypoint python \
            royal-downloader:release-gate \
            scripts/release_readiness_gate.py first-run-auth

      - name: E2E 2 - queue, persistence and restart
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        run: |
          flow_volume="royal-release-flow-${GITHUB_RUN_ID}"
          docker run --rm \
            -v "${flow_volume}:/app/data" \
            --entrypoint python \
            royal-downloader:release-gate \
            scripts/release_readiness_gate.py queue-seed
          docker run --rm \
            -v "${flow_volume}:/app/data" \
            --entrypoint python \
            royal-downloader:release-gate \
            scripts/release_readiness_gate.py queue-restart-verify

      - name: E2E 3 - provider media to queue to status
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        run: |
          flow_volume="royal-release-flow-${GITHUB_RUN_ID}"
          docker run --rm \
            -v "${flow_volume}:/app/data" \
            --entrypoint python \
            royal-downloader:release-gate \
            scripts/release_readiness_gate.py media-flow

      - name: Upgrade and rollback soak from 1.0.0-rc.3
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        shell: bash
        run: |
          rc3_sha="0376d1c17ba3ab25ad312cbecc066f186c152bbe"
          rc_dir="${RUNNER_TEMP}/royal-release-rc3"
          soak_volume="royal-release-soak-${GITHUB_RUN_ID}"
          recovery_volume="royal-release-recovery-${GITHUB_RUN_ID}"
          backup_dir="${RUNNER_TEMP}/royal-release-backup-${GITHUB_RUN_ID}"
          git worktree add --detach "${rc_dir}" "${rc3_sha}"
          docker build \
            --build-arg APP_COMMIT_SHA="${rc3_sha}" \
            --tag royal-downloader:release-rc3 \
            "${rc_dir}"
          docker volume create "${soak_volume}"
          docker run --rm --user 0 \
            -v "${soak_volume}:/app/data" \
            --entrypoint sh \
            royal-downloader:quality \
            -c 'chown -R 1000:1000 /app/data'
          docker run --rm \
            -v "${soak_volume}:/app/data" \
            -v "${GITHUB_WORKSPACE}/scripts/release_readiness_gate.py:/tmp/release_gate.py:ro" \
            --entrypoint python \
            royal-downloader:release-rc3 \
            /tmp/release_gate.py seed-upgrade-rc

          mkdir -p "${backup_dir}"
          chmod 0777 "${backup_dir}"
          docker run --rm --user 0 \
            -v "${soak_volume}:/app/data:ro" \
            -v "${backup_dir}:/backup" \
            --entrypoint python \
            royal-downloader:quality \
            -c "import tarfile; a=tarfile.open('/backup/rc3-data.tar','w'); a.add('/app/data', arcname='.'); a.close()"
          test -s "${backup_dir}/rc3-data.tar"

          docker run --rm \
            -v "${soak_volume}:/app/data" \
            --entrypoint python \
            royal-downloader:release-gate \
            scripts/release_readiness_gate.py verify-upgrade-current
          docker run --rm \
            -v "${soak_volume}:/app/data" \
            --entrypoint python \
            royal-downloader:release-gate \
            scripts/release_readiness_gate.py verify-upgrade-current

          docker run --rm \
            -v "${soak_volume}:/app/data" \
            -v "${GITHUB_WORKSPACE}/scripts/release_readiness_gate.py:/tmp/release_gate.py:ro" \
            --entrypoint python \
            royal-downloader:release-rc3 \
            /tmp/release_gate.py verify-rollback-rc

          docker volume create "${recovery_volume}"
          docker run --rm --user 0 \
            -v "${recovery_volume}:/app/data" \
            --entrypoint sh \
            royal-downloader:quality \
            -c 'chown -R 1000:1000 /app/data'
          docker run --rm --user 0 \
            -v "${recovery_volume}:/app/data" \
            -v "${backup_dir}:/backup:ro" \
            --entrypoint python \
            royal-downloader:quality \
            -c "import tarfile; a=tarfile.open('/backup/rc3-data.tar','r'); a.extractall('/app/data'); a.close()"
          docker run --rm --user 0 \
            -v "${recovery_volume}:/app/data" \
            --entrypoint sh \
            royal-downloader:quality \
            -c 'chown -R 1000:1000 /app/data'
          docker run --rm \
            -v "${recovery_volume}:/app/data" \
            -v "${GITHUB_WORKSPACE}/scripts/release_readiness_gate.py:/tmp/release_gate.py:ro" \
            --entrypoint python \
            royal-downloader:release-rc3 \
            /tmp/release_gate.py verify-rollback-rc

      - name: Published v1.1.0 upgrade, restart, rollback and backup recovery
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        shell: bash
        run: bash scripts/stable_upgrade_gate.sh

      - name: Clean release-readiness resources
        if: always()
        shell: bash
        run: |
          docker volume rm -f \
            "royal-release-flow-${GITHUB_RUN_ID}" \
            "royal-release-soak-${GITHUB_RUN_ID}" \
            "royal-release-recovery-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          git worktree remove --force "${RUNNER_TEMP}/royal-release-rc3" >/dev/null 2>&1 || true
          rm -rf "${RUNNER_TEMP}/royal-release-backup-${GITHUB_RUN_ID}"

      - name: Upload security and coverage artifacts
        if: ${{ steps.change-scope.outputs.backend == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # immutable v6 line
        with:
          name: security-verification-artifacts
          path: |
            coverage.xml
            dependency-sbom.cdx.json
            container-sbom.cdx.json
