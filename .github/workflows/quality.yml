name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m py_compile *.py
          python -m compileall -q providers

      - name: Check web JavaScript
        run: node --check web/app.js

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -p "test_*.py"
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: AndroidApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug lintRelease

      - name: Run Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug and minified release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: royal-downloader-android-apks
          path: |
            AndroidApp/app/build/outputs/apk/debug/app-debug.apk
            AndroidApp/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: royal-downloader-android-r8-mapping
          path: |
            AndroidApp/app/build/outputs/mapping/release/mapping.txt
            AndroidApp/app/build/outputs/mapping/release/configuration.txt
            AndroidApp/app/build/outputs/mapping/release/seeds.txt
            AndroidApp/app/build/outputs/mapping/release/usage.txt
          if-no-files-found: error
          retention-days: 30
