name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Compile Python sources
        run: |
          python -m py_compile *.py
          python -m compileall -q providers

      - name: Check web JavaScript
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Frontend contract smoke tests
        run: node --test tests/frontend_smoke.test.mjs

      - name: Incremental Python correctness baseline
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          mapfile -t changed < <(git diff --name-only "$base" HEAD -- '*.py' 2>/dev/null || true)
          if [ "${#changed[@]}" -gt 0 ]; then
            ruff check --select E9,F63,F7,F82 "${changed[@]}"
          fi

      - name: Security baseline
        run: bandit -q -ll -r api_security.py auth.py network_guard.py runtime_cache.py self_updater.py ytdlp_updater.py

      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Run tests with critical-module coverage
        run: |
          coverage run --source=auth,network_guard,runtime_cache,self_updater,ytdlp_updater -m pytest -q
          coverage report --skip-covered
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: critical-module-coverage
          path: coverage.xml
