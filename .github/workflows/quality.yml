name: Quality checks

on:
  push:
    branches:
      - main
      - overnight
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Live SerienStream browser-session probe
        id: serien_probe
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          xvfb="$(command -v Xvfb || true)"
          if [ -z "$xvfb" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
            xvfb="$(command -v Xvfb)"
          fi
          rm -rf /tmp/royal-probe-chrome
          "$xvfb" :99 -screen 0 1920x1080x24 >/tmp/royal-probe-xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          "$chrome" \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/royal-probe-chrome \
            --window-size=1280,900 \
            about:blank >/tmp/royal-probe-chrome.log 2>&1 &
          chrome_pid=$!
          cleanup_probe_browser() {
            kill "$chrome_pid" >/dev/null 2>&1 || true
            kill "$xvfb_pid" >/dev/null 2>&1 || true
          }
          trap cleanup_probe_browser EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/royal-probe-xvfb.log || true
              cat /tmp/royal-probe-chrome.log || true
              exit 1
            fi
            sleep 1
          done
          ROYAL_PROBE_CDP_PORT=9222 PYTHONPATH=. python tools/live_serienstream_browser_session_probe.py

      - name: Probe observed Turnstile verification UI
        if: steps.serien_probe.outputs.turnstile_cases != '0'
        run: echo "turnstile_cases=${{ steps.serien_probe.outputs.turnstile_cases }}"

      - name: Probe observed SerienStream gate root
        if: steps.serien_probe.outputs.gate_root_cases != '0'
        run: echo "gate_root_cases=${{ steps.serien_probe.outputs.gate_root_cases }}"

      - name: Probe observed player preparation modal
        if: steps.serien_probe.outputs.prepare_modal_cases != '0'
        run: echo "prepare_modal_cases=${{ steps.serien_probe.outputs.prepare_modal_cases }}"

      - name: Probe observed Cloudflare challenge asset
        if: steps.serien_probe.outputs.challenge_cases != '0'
        run: echo "challenge_cases=${{ steps.serien_probe.outputs.challenge_cases }}"

      - name: Probe did not observe verification UI
        if: steps.serien_probe.outputs.turnstile_cases == '0' && steps.serien_probe.outputs.gate_root_cases == '0' && steps.serien_probe.outputs.prepare_modal_cases == '0' && steps.serien_probe.outputs.challenge_cases == '0'
        run: echo "No known verification UI markers were observed in Chromium."

      - name: Probe reached external embeds for all series
        if: steps.serien_probe.outputs.external_total == '3'
        run: echo "External embed reached for all ${{ steps.serien_probe.outputs.external_total }}/3 cases."

      - name: Probe still gated after shared browser session
        if: steps.serien_probe.outputs.external_total != '3'
        run: |
          echo "external_total=${{ steps.serien_probe.outputs.external_total }}"
          echo "external_after_browser=${{ steps.serien_probe.outputs.external_after_browser }}"
          echo "gated_after_browser=${{ steps.serien_probe.outputs.gated_after_browser }}"
          exit 1

      - name: Compile Python sources
        run: |
          python -m py_compile *.py
          python -m compileall -q application_services providers

      - name: Check web JavaScript
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Frontend contract smoke tests
        run: node --test tests/frontend_smoke.test.mjs

      - name: Python correctness baseline
        run: ruff check --select E9,F63,F7,F82 .

      - name: Security baseline
        run: bandit -q -ll -r application_services api_administration_router.py api_auth_router.py api_discovery_router.py api_library_router.py api_queue_router.py api_security.py api_setup_router.py api_storage_router.py api_websocket_router.py app_state.py auth.py config.py media_paths.py media_quality.py network_guard.py queue_jobs.py queue_performance.py runtime_cache.py self_updater.py storage_locations.py storage_manager.py storage_move.py storage_move_runtime.py update_channels.py update_checker.py websocket_manager.py ytdlp_updater.py

      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Run tests with critical-module coverage
        run: |
          coverage run --source=application_services,app_state,auth,config,media_quality,network_guard,queue_jobs,queue_performance,runtime_cache,self_updater,update_channels,update_checker,websocket_manager,ytdlp_updater -m pytest -q
          coverage report --skip-covered --fail-under=45
          coverage report \
            --include='application_services/movie_subscription_quality_hardening.py,application_services/movie_subscription_runtime_hardening.py,application_services/download_storage_guard.py' \
            --fail-under=65
          coverage xml -o coverage.xml

      - name: Build container image
        run: |
          docker build \
            --build-arg APP_COMMIT_SHA="${GITHUB_SHA}" \
            --tag royal-downloader:quality \
            .

      - name: Smoke-test fresh and persistent container startup
        shell: bash
        run: |
          smoke_root="${RUNNER_TEMP}/royal-quality-smoke"
          mkdir -p "${smoke_root}/runtime" "${smoke_root}/data" \
            "${smoke_root}/movies" "${smoke_root}/series"
          sudo chown -R 1000:1000 "${smoke_root}"
          cleanup() { docker rm -f royal-quality-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name royal-quality-smoke \
            --publish 127.0.0.1:18765:8765 \
            --env APP_REQUIRE_AUTH=false \
            --volume "${smoke_root}/runtime:/runtime" \
            --volume "${smoke_root}/data:/app/data" \
            --volume "${smoke_root}/movies:/movies" \
            --volume "${smoke_root}/series:/serien" \
            royal-downloader:quality
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18765/api/health > health.json; then
              break
            fi
            if [ "${attempt}" -eq 90 ]; then
              docker logs royal-quality-smoke
              exit 1
            fi
            sleep 2
          done
          python -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
          curl --fail --silent http://127.0.0.1:18765/api/v1/capabilities > capabilities.json
          python -c 'import json,os; from app_version import APP_VERSION; p=json.load(open("capabilities.json")); assert p["application_version"] == APP_VERSION; assert p["build"] == os.environ["GITHUB_SHA"][:12]'
          python -c 'import json; p=json.load(open("capabilities.json")); assert p["update_channels"] == {"stable": "main", "overnight": "overnight"}'
          curl --fail --silent http://127.0.0.1:18765/api/v1/updater/config > updater-config.json
          python -c 'import json; p=json.load(open("updater-config.json")); assert p["update_channel"] == "stable"; assert p["update_branch"] == "main"'
          test -d "${smoke_root}/data/FilmeDownloader"
          docker restart royal-quality-smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs royal-quality-smoke
          exit 1

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: critical-module-coverage
          path: coverage.xml
