name: Series detail recovery hotfix validation
on:
  push:
    branches: [fix/series-detail-recovery-20261020]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: series-hotfix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Series backend and TMDB resolver regression
        run: python -m pytest -q tests/test_tmdb_people.py tests/test_series_detail_work.py tests/test_series_detail_stability.py tests/test_series_detail_selection.py
      - name: Series frontend detail and lifecycle regression
        run: node --test tests/frontend/detail-loader.test.mjs tests/frontend/series-selection.test.mjs tests/frontend/series-selection.test.mjs
      - name: Syntax and safety
        run: |
          python -m compileall -q api application_services
          node --check web/js/features/media-details/series-api.js
          ruff check --select E9,F63,F7,F82 api application_services tests
