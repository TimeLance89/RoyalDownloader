name: CodeQL security analysis

on:
  push:
    branches:
      - main
      - overnight
  pull_request:
    branches:
      - main
      - overnight
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fa8392b7e54a5d74a53270a4aa7defa307aa415c
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@a0cc01096a24026610f4adb239c336ec0a1e4bd2
        with:
          category: "/language:python"
