<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 424" width="1280" height="424" role="img" aria-labelledby="title description">
<title id="title">RoyalDownloader 2.0 — Your media. Your kingdom.</title>
